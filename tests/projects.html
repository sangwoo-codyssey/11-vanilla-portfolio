<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>RUNNING</title></head>
<body>
<iframe id="main" src="../index.html" width="1280" height="900"></iframe>
<iframe id="demo-error" src="../index.html?state=error" width="600" height="400"></iframe>
<iframe id="demo-empty" src="../index.html?state=empty" width="600" height="400"></iframe>
<iframe id="demo-loading" src="../index.html?state=loading" width="600" height="400"></iframe>
<pre id="out"></pre>
<script>
const log = [];
const check = (name, cond, extra = '') => log.push(`${cond ? 'PASS' : 'FAIL'}  ${name}${extra ? '  (' + extra + ')' : ''}`);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const loaded = async (f) => {
  // iframe 은 처음에 about:blank 문서를 가진다 — 실제 페이지의 #projects-view 가 생길 때까지 기다린다
  for (let i = 0; i < 80; i++) {
    const doc = f.contentDocument;
    if (doc && doc.location.pathname.endsWith('/index.html') && doc.readyState === 'complete' && doc.querySelector('#projects-view')) return;
    await wait(100);
  }
  throw new Error('iframe 로드 대기 초과: ' + f.id);
};
const fake = (w, body, init) => () => Promise.resolve(new w.Response(body, init));
const repo = (over = {}) => ({ name: 'fake-repo', description: '설명', html_url: 'https://github.com/x/fake-repo', language: 'Python', stargazers_count: 3, updated_at: '2026-09-28T00:00:00Z', fork: false, ...over });

async function run() {
  const frames = ['main', 'demo-error', 'demo-empty', 'demo-loading'].map((id) => document.getElementById(id));
  await Promise.all(frames.map(loaded));
  const w = frames[0].contentWindow, d = frames[0].contentDocument;
  const view = () => d.querySelector('#projects-view');

  // 1) 실제 API
  for (let i = 0; i < 40 && view().getAttribute('aria-busy') === 'true'; i++) await wait(250);
  const cards = view().querySelectorAll('.card');
  const summary = view().querySelector('.projects__summary');
  check('실제 API → 성공 상태 카드 렌더링', cards.length > 0, `카드 ${cards.length}개, ${summary ? summary.textContent : view().textContent.trim().slice(0, 80)}`);
  check('카드는 article 이고 Grid 컨테이너 안에 있음', cards.length > 0 && cards[0].tagName === 'ARTICLE' && w.getComputedStyle(view().querySelector('.projects__grid')).display === 'grid');
  const firstLink = view().querySelector('.card__title a');
  check('카드 링크가 sangwoo-codyssey 저장소', firstLink && firstLink.href.startsWith('https://github.com/sangwoo-codyssey/'), firstLink ? firstLink.href : '');
  check('카드 링크는 새 탭 + noopener', firstLink && firstLink.target === '_blank' && firstLink.rel.includes('noopener'));
  const realFetch = w.fetch;

  // 2) 로딩 상태
  w.fetch = () => new Promise(() => {});
  w.loadProjects();
  check('로딩: 스피너 + "로딩 중..." + aria-busy=true', !!view().querySelector('.spinner') && view().textContent.includes('로딩 중...') && view().getAttribute('aria-busy') === 'true');

  // 3) 빈 상태 · fork 만 있는 경우
  w.fetch = fake(w, '[]', { status: 200 }); await w.loadProjects();
  check('빈 배열 → "표시할 프로젝트가 없습니다"', view().textContent.includes('표시할 프로젝트가 없습니다'));
  w.fetch = fake(w, JSON.stringify([repo({ fork: true })]), { status: 200 }); await w.loadProjects();
  check('fork 만 있으면 걸러져 빈 상태', view().textContent.includes('표시할 프로젝트가 없습니다'));

  // 4) 에러: 403 레이트 리밋 · 404 · 네트워크
  const reset = String(Math.floor(Date.now() / 1000) + 1800);
  w.fetch = fake(w, '{}', { status: 403, headers: { 'X-RateLimit-Remaining': '0', 'X-RateLimit-Reset': reset } }); await w.loadProjects();
  check('403 + 남은 횟수 0 → 에러 상태 + 한도 초과 문구', view().textContent.includes('프로젝트를 불러올 수 없습니다') && view().textContent.includes('시간당 60회'), view().querySelector('.status__detail')?.textContent);
  check('에러 상태에 "다시 시도" 버튼', !!view().querySelector('[data-action="retry"]'));
  check('에러일 때 aria-busy=false', view().getAttribute('aria-busy') === 'false');
  w.fetch = fake(w, '{}', { status: 404 }); await w.loadProjects();
  check('404 → 사용자 없음 문구', view().textContent.includes('찾을 수 없습니다'));
  w.fetch = () => Promise.reject(new w.TypeError('Failed to fetch')); await w.loadProjects();
  check('네트워크 실패 → 연결 문구', view().textContent.includes('네트워크에 연결할 수 없습니다'));

  // 5) 다시 시도 → 성공
  w.fetch = fake(w, JSON.stringify([repo()]), { status: 200 });
  view().querySelector('[data-action="retry"]').click();
  await wait(200);
  check('"다시 시도" 클릭 → 다시 불러와 카드 렌더링', view().querySelectorAll('.card').length === 1 && view().textContent.includes('fake-repo'));
  check('카드: 언어·스타·날짜 표시', view().textContent.includes('Python') && view().textContent.includes('★ 3') && view().querySelector('time')?.getAttribute('datetime') === '2026-09-28T00:00:00Z');

  // 6) 외부 데이터 escape
  w.__xss = undefined;
  w.fetch = fake(w, JSON.stringify([repo({ name: '<img src=x onerror="window.__xss=1">', description: '<b>굵게</b>' , language: null, description: null })]), { status: 200 });
  await w.loadProjects(); await wait(100);
  check('저장소 이름의 태그가 실행되지 않음(escape)', !view().querySelector('.card img') && w.__xss === undefined && view().querySelector('.card__title').textContent.includes('<img'));
  check('설명·언어 없으면 "설명이 없습니다" + 언어 칸 생략', view().textContent.includes('설명이 없습니다') && view().querySelectorAll('.card__meta li').length === 2);
  w.fetch = realFetch;

  // 7) 시연용 ?state=
  const dv = (i) => frames[i].contentDocument.querySelector('#projects-view');
  check('?state=error → 에러 UI + 다시 시도', dv(1).textContent.includes('프로젝트를 불러올 수 없습니다') && !!dv(1).querySelector('[data-action="retry"]'));
  check('?state=empty → 빈 상태', dv(2).textContent.includes('표시할 프로젝트가 없습니다'));
  check('?state=loading → 스피너 유지', !!dv(3).querySelector('.spinner'));

  document.getElementById('out').textContent = log.join('\n');
  document.title = 'DONE';
}
run().catch((e) => { document.getElementById('out').textContent = 'ERROR ' + e.stack; document.title = 'DONE'; });
</script>
</body></html>
